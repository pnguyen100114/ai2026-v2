<!doctype html><meta charset="utf-8"><style>
* { box-sizing: border-box; }
html, body { margin: 0; width: 1920px; height: 1080px; background: #fff; overflow: hidden; }
body { font-family: 'Segoe UI', Arial, sans-serif; color: #1B2A4A; }
.slide { width: 1920px; height: 1080px; padding: 72px; display: flex; flex-direction: column; }
.ic { display: grid; place-items: center; border-radius: 26px; flex: none; }
.coral { background: #FDE7E0; color: #F2704F; }
.navy { background: #E6EBF3; color: #1B2A4A; }
.green { background: #DDF3EA; color: #16875F; }
.amber { background: #FDF1D6; color: #B7791F; }
.violet { background: #ECE8FB; color: #6247C9; }
.solid { background: #F2704F; color: #fff; }

.eyebrow { font-size: 24px; font-weight: 800; letter-spacing: .16em; color: #F2704F; margin-bottom: 12px; }
h1 { margin: 0; font-size: 58px; line-height: 1.12; letter-spacing: -.01em; }
h1 em { font-style: normal; color: #F2704F; }

.band { margin-top: 34px; }
.band-label { display: flex; align-items: center; gap: 14px; font-size: 23px; font-weight: 800;
  letter-spacing: .1em; color: #8E97A5; margin-bottom: 20px; }
.band-label .tag { background: #F1F3F7; border-radius: 999px; padding: 7px 18px; font-size: 20px;
  letter-spacing: .04em; color: #6B7280; font-weight: 700; }

.row { display: grid; grid-template-columns: 1fr 90px 1fr 90px 1fr 90px 1fr; align-items: start; }
.arrow { color: #C3CAD5; display: grid; place-items: center; padding-top: 30px; }
.node { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 14px; }
.node .ic { width: 104px; height: 104px; }
.node h4 { margin: 0; font-size: 29px; line-height: 1.2; }
.node p { margin: 0; font-size: 20px; line-height: 1.45; color: #4B5563; max-width: 330px; }
.node.key h4 { color: #F2704F; }

.bypass { position: relative; height: 104px; }
.bypass svg.path { position: absolute; left: 0; top: 0; }
.bypass .stamp { position: absolute; display: flex; align-items: center; gap: 12px;
  background: #fff; padding: 0 16px; font-size: 25px; font-weight: 800; color: #F2704F; }
.bypass .stamp .x { display: grid; place-items: center; width: 44px; height: 44px; border-radius: 50%;
  background: #F2704F; color: #fff; flex: none; }

.foot { margin-top: auto; padding-top: 34px; display: flex; align-items: center; gap: 16px; }
.chip { display: flex; align-items: center; gap: 12px; background: #FAFBFD; border: 2px solid #EEF1F6;
  border-radius: 999px; padding: 12px 24px; font-size: 22px; font-weight: 600; color: #4B5563; }
.chip svg { color: #8E97A5; }
.foot .note { margin-left: auto; font-size: 22px; color: #9AA3AF; }

.cmp { display: grid; grid-template-columns: 1fr 108px 1fr; align-items: stretch; margin-top: 58px; }
.cmp .mid { display: grid; place-items: center; color: #C3CAD5; }
.card { border: 3px solid #EEF1F6; border-radius: 30px; padding: 40px 42px; background: #FAFBFD; }
.card.now { border-color: #FBD5C8; background: #FFF8F5; }
.card .head { display: flex; align-items: center; gap: 20px; margin-bottom: 34px; }
.card .head .ic { width: 88px; height: 88px; border-radius: 26px; }
.card .tag { font-size: 19px; font-weight: 800; letter-spacing: .14em; color: #9AA3AF; }
.card.now .tag { color: #F2704F; }
.card h3 { margin: 4px 0 0; font-size: 36px; line-height: 1.15; }
.li { display: flex; align-items: flex-start; gap: 15px; font-size: 27px; line-height: 1.45;
  color: #374151; margin-bottom: 26px; }
.li svg { flex: none; margin-top: 5px; color: #9AA3AF; }
.card.now .li svg { color: #16875F; }
.li b { color: #1B2A4A; }
.tail { margin-top: auto; display: flex; align-items: center; gap: 16px; justify-content: center;
  font-size: 24px; color: #4B5563; background: #F1F3F7; border-radius: 999px; padding: 18px 32px; }
.tail svg { color: #8E97A5; flex: none; }

.slide.dark { position: relative; background: #1B2A4A;
  background-image: radial-gradient(900px 620px at 82% 16%, rgba(242,112,79,.22), transparent 70%);
  color: #fff; align-items: center; justify-content: center; text-align: center; }
.mark { width: 132px; height: 132px; border-radius: 38px; background: #F2704F; color: #fff;
  display: grid; place-items: center; margin-bottom: 34px; }
.brand { font-size: 132px; font-weight: 800; line-height: 1; letter-spacing: -.02em; }
.tagline { font-size: 38px; color: rgba(255,255,255,.72); margin-top: 18px; }
.rule { width: 120px; height: 4px; border-radius: 2px; background: rgba(255,255,255,.2); margin: 46px 0; }
.slogan { font-size: 64px; font-weight: 700; color: #F2704F; line-height: 1.2; }
.team { font-size: 31px; color: rgba(255,255,255,.8); margin-top: 52px; }
.team b { font-weight: 700; color: #fff; }
.thanks { position: absolute; bottom: 72px; font-size: 26px; color: rgba(255,255,255,.42); }
</style><body><div class="slide dark">
  <div class="mark"><svg xmlns="http://www.w3.org/2000/svg" width="68" height="68" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 8V4H8"/><rect width="16" height="12" x="4" y="8" rx="2"/><path d="M2 14h2"/><path d="M20 14h2"/><path d="M15 13v2"/><path d="M9 13v2"/></svg></div>
  <div class="brand">Mimo</div>
  <div class="tagline">Gia sư AI học theo sách giáo khoa</div>
  <div class="rule"></div>
  <div class="slogan">Học đúng sách, hiểu đúng bài.</div>
  <div class="team">Đội <b>LD-14</b> · Trường THCS Tân An Hội</div>
  <div class="thanks">Cảm ơn thầy cô đã lắng nghe</div>
</div></body>
