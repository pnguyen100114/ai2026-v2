<!doctype html><meta charset="utf-8"><style>
* { box-sizing: border-box; }
html, body { margin: 0; background: #fff; }
body { font-family: 'Segoe UI', Arial, sans-serif; color: #1B2A4A; }
.canvas { padding: 32px; }
.ic { display: grid; place-items: center; border-radius: 18px; flex: none; }
.coral { background: #FDE7E0; color: #F2704F; }
.navy { background: #E6EBF3; color: #1B2A4A; }
.green { background: #DDF3EA; color: #16875F; }
.amber { background: #FDF1D6; color: #B7791F; }
.violet { background: #ECE8FB; color: #6247C9; }
.solid { background: #F2704F; color: #fff; }
h3 { margin: 0; font-size: 22px; }
p { margin: 0; }

.row { display: grid; gap: 24px; }
.card { background: #FAFBFD; border: 2px solid #EEF1F6; border-radius: 26px; padding: 28px; display: flex; flex-direction: column; gap: 14px; }
.card p { font-size: 18px; line-height: 1.5; color: #4B5563; }
</style><body><div class="canvas"><div class="row" style="grid-template-columns:repeat(3,1fr)">
      <div class="card">
        <div class="ic coral" style="width:76px;height:76px"><svg xmlns="http://www.w3.org/2000/svg" width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg></div>
        <h3>Chép đáp án cho xong</h3><p>Chatbot giải luôn cả bài. Làm xong bài tập nhưng gặp dạng tương tự vẫn bí.</p>
      </div>
      <div class="card">
        <div class="ic amber" style="width:76px;height:76px"><svg xmlns="http://www.w3.org/2000/svg" width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m14.5 7.5-5 5"/><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H19a1 1 0 0 1 1 1v18a1 1 0 0 1-1 1H6.5a1 1 0 0 1 0-5H20"/><path d="m9.5 7.5 5 5"/></svg></div>
        <h3>Lệch sách giáo khoa</h3><p>Thuật ngữ, cách giải khác sách đang học, có khi dùng kiến thức lớp trên.</p>
      </div>
      <div class="card">
        <div class="ic violet" style="width:76px;height:76px"><svg xmlns="http://www.w3.org/2000/svg" width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="M12 8v4"/><path d="M12 16h.01"/></svg></div>
        <h3>Không ai để ý khi em buồn</h3><p>Bạn nhắn chuyện bị bắt nạt cũng không chắc được chỉ tới người lớn giúp đỡ.</p>
      </div></div></div></body>
