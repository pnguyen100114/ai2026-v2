<!doctype html><meta charset="utf-8"><style>
* { box-sizing: border-box; }
html, body { margin: 0; background: #fff; }
body { font-family: 'Segoe UI', Arial, sans-serif; color: #1B2A4A; }
.canvas { padding: 32px; }
.ic { display: grid; place-items: center; border-radius: 18px; flex: none; }
.coral { background: #FDE7E0; color: #F2704F; }
.navy { background: #E6EBF3; color: #1B2A4A; }
.green { background: #DDF3EA; color: #16875F; }
.amber { background: #FDF1D6; color: #B7791F; }
.violet { background: #ECE8FB; color: #6247C9; }
.solid { background: #F2704F; color: #fff; }
h3 { margin: 0; font-size: 22px; }
p { margin: 0; }

.row { display: grid; gap: 24px; }
.card { background: #FAFBFD; border: 2px solid #EEF1F6; border-radius: 26px; padding: 28px; display: flex; flex-direction: column; gap: 14px; }
.card p { font-size: 18px; line-height: 1.5; color: #4B5563; }

.label { font-size: 17px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: #9AA3AF; margin: 0 0 14px 4px; }
.tile { display: flex; gap: 18px; align-items: flex-start; background: #FAFBFD; border: 2px solid #EEF1F6; border-radius: 22px; padding: 20px; }
.tile h4 { margin: 0 0 6px; font-size: 20px; }
.tile p { font-size: 16px; line-height: 1.45; color: #4B5563; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }

.kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px; }
.kpi { background: #FAFBFD; border: 2px solid #EEF1F6; border-radius: 24px; padding: 22px; display: flex; flex-direction: column; gap: 10px; }
.kpi b { font-size: 44px; line-height: 1; color: #1B2A4A; }
.kpi span { font-size: 16px; color: #4B5563; line-height: 1.4; }
</style><body><div class="canvas"><div class="kpis">

  <div class="kpi"><div class="ic coral" style="width:56px;height:56px;border-radius:16px"><svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.992 16.342a2 2 0 0 1 .094 1.167l-1.065 3.29a1 1 0 0 0 1.236 1.168l3.413-.998a2 2 0 0 1 1.099.092 10 10 0 1 0-4.777-4.719"/></svg></div><b>52</b><span>câu hỏi thử ở 3 môn Toán, KHTN, Ngữ văn</span></div>
  <div class="kpi"><div class="ic amber" style="width:56px;height:56px;border-radius:16px"><svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="10" x2="14" y1="2" y2="2"/><line x1="12" x2="15" y1="14" y2="11"/><circle cx="12" cy="14" r="8"/></svg></div><b>4,7 giây</b><span>một nửa số câu Mimo trả lời xong trong khoảng này</span></div>
  <div class="kpi"><div class="ic navy" style="width:56px;height:56px;border-radius:16px"><svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="m16 9-5.5 5.5L8 12"/></svg></div><b>194/194</b><span>ca kiểm thử tự động đều chạy đúng</span></div>
</div></div></body>
