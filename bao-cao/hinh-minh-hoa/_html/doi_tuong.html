<!doctype html><meta charset="utf-8"><style>
* { box-sizing: border-box; }
html, body { margin: 0; background: #fff; }
body { font-family: 'Segoe UI', Arial, sans-serif; color: #1B2A4A; }
.canvas { padding: 32px; }
.ic { display: grid; place-items: center; border-radius: 18px; flex: none; }
.coral { background: #FDE7E0; color: #F2704F; }
.navy { background: #E6EBF3; color: #1B2A4A; }
.green { background: #DDF3EA; color: #16875F; }
.amber { background: #FDF1D6; color: #B7791F; }
.violet { background: #ECE8FB; color: #6247C9; }
.solid { background: #F2704F; color: #fff; }
h3 { margin: 0; font-size: 22px; }
p { margin: 0; }

.row { display: grid; gap: 24px; }
.card { background: #FAFBFD; border: 2px solid #EEF1F6; border-radius: 26px; padding: 28px; display: flex; flex-direction: column; gap: 14px; }
.card p { font-size: 18px; line-height: 1.5; color: #4B5563; }
</style><body><div class="canvas"><div class="row" style="grid-template-columns:repeat(3,1fr)">
      <div class="card">
        <div class="ic solid" style="width:76px;height:76px"><svg xmlns="http://www.w3.org/2000/svg" width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.42 10.922a1 1 0 0 0-.019-1.838L12.83 5.18a2 2 0 0 0-1.66 0L2.6 9.08a1 1 0 0 0 0 1.832l8.57 3.908a2 2 0 0 0 1.66 0z"/><path d="M22 10v6"/><path d="M6 12.5V16a6 3 0 0 0 12 0v-3.5"/></svg></div>
        <h3>Học sinh lớp 6 – 9</h3><p>Hỏi bài lúc tự học ở nhà, hiểu cách làm, luyện tập vừa sức để không nản.</p>
      </div>
      <div class="card">
        <div class="ic navy" style="width:76px;height:76px"><svg xmlns="http://www.w3.org/2000/svg" width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/><path d="M3 10a2 2 0 0 1 .709-1.528l7-6a2 2 0 0 1 2.582 0l7 6A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg></div>
        <h3>Phụ huynh</h3><p>Con có người kèm bài miễn phí, không làm bài hộ, biết khuyên con tìm người lớn khi cần.</p>
      </div>
      <div class="card">
        <div class="ic green" style="width:76px;height:76px"><svg xmlns="http://www.w3.org/2000/svg" width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 21v-3a2 2 0 0 0-4 0v3"/><path d="M18 4.933V21"/><path d="m4 6 7.106-3.79a2 2 0 0 1 1.788 0L20 6"/><path d="m6 11-3.52 2.147a1 1 0 0 0-.48.854V19a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-5a1 1 0 0 0-.48-.853L18 11"/><path d="M6 4.933V21"/><circle cx="12" cy="9" r="2"/></svg></div>
        <h3>Thầy cô</h3><p>Học sinh ôn đúng nội dung, đúng thuật ngữ trong sách; biết các em hay vướng ở đâu.</p>
      </div></div></div></body>
